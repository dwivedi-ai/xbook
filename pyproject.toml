[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xbook"
version = "1.0.0"
description = "Export your X (Twitter) bookmarks to JSON. Local, read-only, no API key required."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["twitter", "x", "bookmarks", "export", "scraper", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "playwright>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[project.scripts]
xbook = "xbook.cli:main"

[project.urls]
Homepage = "https://github.com/dwivedi-ai/xbook"
Issues = "https://github.com/dwivedi-ai/xbook/issues"

[tool.setuptools.packages.find]
include = ["xbook*"]
